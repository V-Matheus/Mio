syntax = "proto3";

package mio.catalog.v1;

service CatalogService {
  rpc ListCategories(ListCategoriesRequest) returns (CategoriesResponse);
  rpc ListTracks(ListTracksRequest) returns (TracksResponse);
  rpc GetTrack(GetTrackRequest) returns (TrackDetailResponse);
  rpc GetLesson(GetLessonRequest) returns (LessonDetailResponse);
  rpc GetSection(GetSectionRequest) returns (SectionDetailResponse);
  rpc EnrollUser(EnrollUserRequest) returns (EnrollmentResponse);
}

message ListCategoriesRequest {}

message Category {
  string id = 1;
  string slug = 2;
  string name = 3;
  string color = 4;
}

message CategoriesResponse {
  repeated Category categories = 1;
}

message ListTracksRequest {
  string user_code = 1; // opcional: marca `enrolled` por usuário
}

message Track {
  int32 id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  int32 lesson_count = 5;
  bool enrolled = 6;
  Category category = 7;
}

message TracksResponse {
  repeated Track tracks = 1;
}

message GetTrackRequest {
  string slug = 1;
  string user_code = 2;
}

message LessonSummary {
  int32 id = 1;
  string slug = 2;
  string title = 3;
  int32 position = 4;
  bool completed = 5;
}

message TrackDetailResponse {
  int32 id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  repeated LessonSummary lessons = 5;
  bool enrolled = 6;
  Category category = 7;
}

message GetLessonRequest {
  string track_slug = 1;
  string lesson_slug = 2;
  string user_code = 3;
}

message SectionSummary {
  int32 id = 1;
  string slug = 2;
  string title = 3;
  int32 position = 4;
  string kind = 5; // "TEXT" | "EXERCISE"
  bool completed = 6;
}

message LessonDetailResponse {
  int32 id = 1;
  string track_slug = 2;
  string lesson_slug = 3;
  string title = 4;
  repeated SectionSummary sections = 5;
}

message GetSectionRequest {
  string track_slug = 1;
  string lesson_slug = 2;
  string section_slug = 3;
}

message SectionDetailResponse {
  int32 id = 1;
  string slug = 2;
  string title = 3;
  string kind = 4; // "TEXT" | "EXERCISE"
  string content_markdown = 5;
}

message EnrollUserRequest {
  string user_code = 1;
  int32 track_id = 2;
}

message EnrollmentResponse {
  bool ok = 1;
}
