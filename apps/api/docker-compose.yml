x-log-rotation: &log-rotation
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres-core:
    logging: *log-rotation
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${CORE_POSTGRES_USER:?CORE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:?CORE_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${CORE_POSTGRES_DB:?CORE_POSTGRES_DB is required}
    volumes:
      - postgres-core-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres-gamification:
    logging: *log-rotation
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${GAMIFICATION_POSTGRES_USER:?GAMIFICATION_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${GAMIFICATION_POSTGRES_PASSWORD:?GAMIFICATION_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${GAMIFICATION_POSTGRES_DB:?GAMIFICATION_POSTGRES_DB is required}
    volumes:
      - postgres-gamification-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres-achievements:
    logging: *log-rotation
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${ACHIEVEMENTS_POSTGRES_USER:?ACHIEVEMENTS_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${ACHIEVEMENTS_POSTGRES_PASSWORD:?ACHIEVEMENTS_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${ACHIEVEMENTS_POSTGRES_DB:?ACHIEVEMENTS_POSTGRES_DB is required}
    volumes:
      - postgres-achievements-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    logging: *log-rotation
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    logging: *log-rotation
    image: rabbitmq:4-management-alpine
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Only this service declares `build:`. The image is built once and reused
  # by the other API services via `MIO_API_IMAGE` below — each picks its
  # process via the `SERVICE` env var consumed by the Dockerfile CMD.
  api-gateway:
    logging: *log-rotation
    image: ${MIO_API_IMAGE:-mio-api}
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      SERVICE: gateway
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set and non-empty}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and non-empty}
    expose:
      - "${GATEWAY_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api-core:
        condition: service_healthy
      api-gamification:
        condition: service_healthy
      api-achievements:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.GATEWAY_PORT || 3333) + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 20s

  api-ops:
    logging: *log-rotation
    image: ${MIO_API_IMAGE:-mio-api}
    profiles: ["ops"]
    env_file:
      - .env
    working_dir: /app/apps/api
    depends_on:
      postgres-core:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
      postgres-achievements:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["yarn", "--help"]
    restart: "no"

  # Local production-like deploy job. Uses this Compose project's default
  # network and the same API env/database services as the runtime stack.
  api-migrate:
    logging: *log-rotation
    image: mio-api-migrator
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
      target: migrator
    profiles: ["migrate"]
    env_file:
      - .env
    working_dir: /app/apps/api
    command: ["yarn", "prisma:migrate:deploy"]
    depends_on:
      postgres-core:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
      postgres-achievements:
        condition: service_healthy
    restart: "no"

  api-core:
    logging: *log-rotation
    image: ${MIO_API_IMAGE:-mio-api}
    env_file:
      - .env
    environment:
      SERVICE: core
      HEALTHCHECK_GRPC_PORT: ${CORE_GRPC_PORT:?CORE_GRPC_PORT is required}
    expose:
      - "${CORE_GRPC_PORT}"
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck-grpc.cjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  api-gamification:
    logging: *log-rotation
    image: ${MIO_API_IMAGE:-mio-api}
    env_file:
      - .env
    environment:
      SERVICE: gamification
      HEALTHCHECK_GRPC_PORT: ${GAMIFICATION_GRPC_PORT:?GAMIFICATION_GRPC_PORT is required}
    expose:
      - "${GAMIFICATION_GRPC_PORT}"
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck-grpc.cjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-gamification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  api-achievements:
    logging: *log-rotation
    image: ${MIO_API_IMAGE:-mio-api}
    env_file:
      - .env
    environment:
      SERVICE: achievements
      HEALTHCHECK_GRPC_PORT: ${ACHIEVEMENTS_GRPC_PORT:?ACHIEVEMENTS_GRPC_PORT is required}
    expose:
      - "${ACHIEVEMENTS_GRPC_PORT}"
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck-grpc.cjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-achievements:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  api-messenger:
    logging: *log-rotation
    image: ${MIO_API_IMAGE:-mio-api}
    env_file:
      - .env
    environment:
      SERVICE: messenger
      HEALTHCHECK_GRPC_PORT: ${MESSENGER_GRPC_PORT:?MESSENGER_GRPC_PORT is required}
    expose:
      - "${MESSENGER_GRPC_PORT}"
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck-grpc.cjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 20s

  api-notifications:
    logging: *log-rotation
    image: ${MIO_API_IMAGE:-mio-api}
    env_file:
      - .env
    environment:
      SERVICE: notifications
      HEALTHCHECK_GRPC_PORT: ${NOTIFICATIONS_GRPC_PORT:?NOTIFICATIONS_GRPC_PORT is required}
    expose:
      - "${NOTIFICATIONS_GRPC_PORT}"
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck-grpc.cjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  postgres-core-data:
  postgres-gamification-data:
  postgres-achievements-data:
  redis-data:
  rabbitmq-data:
