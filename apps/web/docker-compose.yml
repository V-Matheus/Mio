services:
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set and non-empty}
    depends_on:
      - api-gateway
    restart: unless-stopped
