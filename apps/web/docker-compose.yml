x-log-rotation: &log-rotation
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    logging: *log-rotation
    image: ${MIO_WEB_IMAGE:-mio-web}
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set and non-empty}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set and non-empty}
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 20s
