services:
  web:
    image: mio-web-dev
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile.dev
    command: yarn workspace @mio/web dev
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set and non-empty}
    ports:
      - "3000:3000"
    volumes:
      - ../../:/app
    depends_on:
      - api-gateway
