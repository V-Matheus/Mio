name: CI - API

on:
  workflow_call:

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint --filter=@mio/api

      - name: Type Check
        run: yarn check-types --filter=@mio/api

      - name: Build operational scripts
        run: yarn workspace @mio/api build:ops

      - name: Run Tests
        run: yarn test --filter=@mio/api
