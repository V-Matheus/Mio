name: Deploy to VM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full Git commit SHA for the images to deploy
        required: true
        type: string
      target_environment:
        description: GitHub Environment containing the target server's deploy secrets
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull images and update VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.target_environment }}
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be a full 40-character Git commit SHA" >&2
            exit 1
          fi

      - name: Checkout the published commit's deployment manifests
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_ed25519" "$RUNNER_TEMP/deploy-ssh/known_hosts"

      - name: Log in to GHCR on the VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          GHCR_USERNAME="$(printf '%s' "$GHCR_USERNAME" | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$GHCR_USERNAME" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "Configure the repository Actions variable GHCR_USERNAME as the user that owns GHCR_READ_TOKEN." >&2
            exit 1
          fi
          printf '%s' "$GHCR_READ_TOKEN" | ssh \
            -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy selected image version
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          GHCR_NAMESPACE="$(printf '%s' "$GHCR_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$GHCR_NAMESPACE" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "Configure the repository Actions variable GHCR_NAMESPACE with the GHCR account or organization namespace." >&2
            exit 1
          fi

          ssh_args=(
            -i "$RUNNER_TEMP/deploy-ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts"
          )

          tar -cf - docker-compose.yml apps/api/docker-compose.yml apps/web/docker-compose.yml release scripts/ops |
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p /opt/mio/apps/api /opt/mio/apps/web /opt/mio/release/environments/production/environment /opt/mio/release/scripts /opt/mio/scripts/ops/lib && \
               tar -xf - -C /opt/mio && \
               cd /opt/mio && \
               bash release/scripts/release.sh production '$IMAGE_TAG' '$GHCR_NAMESPACE'"

      - name: Log out of GHCR on the VM
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker logout ghcr.io' || true
