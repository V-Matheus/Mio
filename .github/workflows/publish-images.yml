name: Publish container images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release tags
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.namespace.outputs.value }}
      already_ready: ${{ steps.release_check.outputs.already_ready }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GHCR namespace
        id: namespace
        env:
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
        run: |
          set -euo pipefail
          GHCR_NAMESPACE="$(printf '%s' "$GHCR_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$GHCR_NAMESPACE" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "Configure the repository Actions variable GHCR_NAMESPACE with the GHCR account or organization namespace." >&2
            exit 1
          fi
          echo "value=$GHCR_NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Check whether this SHA is already published
        id: release_check
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_NAMESPACE: ${{ steps.namespace.outputs.value }}
        run: |
          set -euo pipefail

          tag_state() {
            local image_ref="$1"
            local output

            if output="$(docker buildx imagetools inspect "$image_ref" 2>&1)"; then
              return 0
            fi

            if grep -Eqi 'MANIFEST_UNKNOWN|manifest unknown|no such manifest|404 Not Found|status code: 404|: not found$' <<< "$output"; then
              return 1
            fi

            printf '%s\n' "$output" >&2
            return 2
          }

          ready_ref="ghcr.io/$GHCR_NAMESPACE/mio-api:ready-$IMAGE_TAG"
          if tag_state "$ready_ref"; then
            for image_ref in \
              "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG" \
              "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG-migrator" \
              "ghcr.io/$GHCR_NAMESPACE/mio-web:$IMAGE_TAG"; do
              if tag_state "$image_ref"; then
                continue
              else
                result=$?
                echo "O marcador ready existe, mas o conjunto está incompleto ou não pôde ser verificado: $image_ref (status $result)" >&2
                echo "A publicação foi interrompida; não altere tags de uma release marcada como pronta." >&2
                exit 1
              fi
            done
            echo "Release $IMAGE_TAG já está completo; as tags imutáveis serão preservadas."
            echo "already_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            result=$?
            if [[ "$result" -ne 1 ]]; then
              echo "Não foi possível verificar o marcador $ready_ref; abortando para evitar sobrescrever uma release." >&2
              exit 1
            fi
          fi

          for image_ref in \
            "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG" \
            "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG-migrator" \
            "ghcr.io/$GHCR_NAMESPACE/mio-web:$IMAGE_TAG"; do
            if tag_state "$image_ref"; then
              echo "Tag final existente sem marcador ready: $image_ref" >&2
              echo "A publicação foi interrompida para preservar a imagem existente. Faça a recuperação desse SHA manualmente." >&2
              exit 1
            else
              result=$?
              if [[ "$result" -ne 1 ]]; then
                echo "Não foi possível verificar $image_ref; abortando para evitar sobrescrever uma imagem." >&2
                exit 1
              fi
            fi
          done

          echo "already_ready=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target_name }} (${{ matrix.arch }})
    needs: check
    if: ${{ needs.check.outputs.already_ready != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            target_name: API runtime
            dockerfile: apps/api/Dockerfile
            target: runner
            candidate: api
            cache: mio-api-runner-arm64
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: api
            target_name: API migrator
            dockerfile: apps/api/Dockerfile
            target: migrator
            candidate: migrator
            cache: mio-api-migrator-arm64
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: web
            target_name: web
            dockerfile: apps/web/Dockerfile
            target: runner
            candidate: web
            cache: mio-web-arm64
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ needs.check.outputs.namespace }}/mio-${{ matrix.image }}:candidate-${{ matrix.candidate }}-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  publish:
    name: Assemble and publish immutable image set
    needs: [check, build]
    if: ${{ needs.check.outputs.already_ready != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote runtime, migrator, and web images to commit tags
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_NAMESPACE: ${{ needs.check.outputs.namespace }}
          CANDIDATE_SUFFIX: ${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG" \
            "ghcr.io/$GHCR_NAMESPACE/mio-api:candidate-api-$CANDIDATE_SUFFIX-arm64"

          docker buildx imagetools create \
            --tag "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG-migrator" \
            "ghcr.io/$GHCR_NAMESPACE/mio-api:candidate-migrator-$CANDIDATE_SUFFIX-arm64"

          docker buildx imagetools create \
            --tag "ghcr.io/$GHCR_NAMESPACE/mio-web:$IMAGE_TAG" \
            "ghcr.io/$GHCR_NAMESPACE/mio-web:candidate-web-$CANDIDATE_SUFFIX-arm64"

      - name: Mark the complete image set as deployable
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_NAMESPACE: ${{ needs.check.outputs.namespace }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/$GHCR_NAMESPACE/mio-api:ready-$IMAGE_TAG" \
            "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG"
