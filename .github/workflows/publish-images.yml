name: Publish container images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push Mio images
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GHCR namespace
        id: namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "value=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.value }}/mio-api:candidate-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=mio-api
          cache-to: type=gha,mode=max,scope=mio-api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.namespace.outputs.value }}/mio-web:candidate-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=mio-web
          cache-to: type=gha,mode=max,scope=mio-web

      - name: Promote both images to the commit tag
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_NAMESPACE: ${{ steps.namespace.outputs.value }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG" \
            "ghcr.io/$GHCR_NAMESPACE/mio-api:candidate-$IMAGE_TAG"
          docker buildx imagetools create \
            --tag "ghcr.io/$GHCR_NAMESPACE/mio-web:$IMAGE_TAG" \
            "ghcr.io/$GHCR_NAMESPACE/mio-web:candidate-$IMAGE_TAG"

      - name: Mark the complete image set as deployable
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_NAMESPACE: ${{ steps.namespace.outputs.value }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/$GHCR_NAMESPACE/mio-api:ready-$IMAGE_TAG" \
            "ghcr.io/$GHCR_NAMESPACE/mio-api:$IMAGE_TAG"
